# Sombra · ambiente local (make up). Tudo só em 127.0.0.1.
# Core, Clima e painel ainda são placeholders: cada um é trocado pelo serviço real na sua fase (F1.8, F3.1, F7.1).
name: sombra

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?rode make env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?rode make env}
      CORE_DB_PASSWORD: ${CORE_DB_PASSWORD:?rode make env}
      CLIMA_DB_PASSWORD: ${CLIMA_DB_PASSWORD:?rode make env}
    volumes:
      - dados-postgres:/var/lib/postgresql/data
      - ./infra/compose/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      # no host fica em 55432 para não brigar com um PostgreSQL local; dentro do compose é db:5432
      - "127.0.0.1:${DB_PORTA_LOCAL:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  mqtt:
    image: eclipse-mosquitto:2
    volumes:
      - ./infra/compose/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "127.0.0.1:1883:1883"
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -t '$$SYS/broker/version' -C 1 -W 3 >/dev/null"]
      interval: 3s
      timeout: 5s
      retries: 20

  core:
    # placeholder até a F1.8 (API com logs e /health)
    image: nginx:1-alpine
    environment:
      SERVICO: core-api
      PORTA: "5080"
      FASE: F1.8
    volumes:
      - ./infra/compose/placeholder:/etc/nginx/templates:ro
    ports:
      - "127.0.0.1:5080:5080"
    depends_on:
      db: { condition: service_healthy }
      mqtt: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5080/health/live >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 20

  clima:
    # placeholder até a F3.1
    image: nginx:1-alpine
    environment:
      SERVICO: clima-service
      PORTA: "8081"
      FASE: F3.1
    volumes:
      - ./infra/compose/placeholder:/etc/nginx/templates:ro
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/actuator/health/liveness >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 20

  painel:
    # placeholder até a F7.1
    image: nginx:1-alpine
    environment:
      SERVICO: painel
      PORTA: "5173"
      FASE: F7.1
    volumes:
      - ./infra/compose/placeholder:/etc/nginx/templates:ro
    ports:
      - "127.0.0.1:5173:5173"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173/healthz >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  dados-postgres:
