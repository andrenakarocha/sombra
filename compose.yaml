# Sombra · ambiente local (make up). Tudo só em 127.0.0.1.
name: sombra

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?rode make env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?rode make env}
      CORE_DB_PASSWORD: ${CORE_DB_PASSWORD:?rode make env}
      CLIMA_DB_PASSWORD: ${CLIMA_DB_PASSWORD:?rode make env}
    volumes:
      - dados-postgres:/var/lib/postgresql/data
      - ./infra/compose/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      # no host fica em 55432 para não brigar com um PostgreSQL local; dentro do compose é db:5432
      - "127.0.0.1:${DB_PORTA_LOCAL:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  mqtt:
    image: eclipse-mosquitto:2
    volumes:
      - ./infra/compose/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "127.0.0.1:1883:1883"
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -t '$$SYS/broker/version' -C 1 -W 3 >/dev/null"]
      interval: 3s
      timeout: 5s
      retries: 20

  core:
    # a Core API (.NET 10): migra o banco ao subir e cria as contas da demo quando há Demo__Senha
    build:
      context: services/core-api
      args:
        COMMIT: ${SOMBRA_COMMIT:-dev}
        CONSTRUIDO_EM: ${SOMBRA_CONSTRUIDO_EM:-}
    image: sombra-core-api:local
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Core: Host=db;Port=5432;Database=sombra_core;Username=sombra_core;Password=${CORE_DB_PASSWORD:?rode make env}
      Jwt__Emissor: ${Jwt__Emissor:-sombra-core}
      Jwt__Segredo: ${Jwt__Segredo:?rode make env}
      Demo__Senha: ${Demo__Senha:-}
      Demo__SentinelaDeviceId: ${SENTINELA_DEVICE_ID:-snt-7f3a9c}
      Demo__SentinelaSegredoHex: ${SENTINELA_SEGREDO_HEX:-}
      Sentinela__ChaveDeVinculo: ${SENTINELA_CHAVE_DE_VINCULO:?rode make env}
      Privacidade__ChaveAes: ${Privacidade__ChaveAes:?rode make env}
      Privacidade__ChaveIndiceCego: ${Privacidade__ChaveIndiceCego:?rode make env}
      Privacidade__Aplicacao: ${Privacidade__Aplicacao:-Ligada}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      Gemini__Modelo: ${Gemini__Modelo:-}
      Ops__TokenDoMonitor: ${Ops__TokenDoMonitor:-}
      Mqtt__Host: mqtt
      Mqtt__Porta: "1883"
      # o risco de calor e os pontos de resfriamento vêm do Clima de verdade (sem isso, o Core usa o modo offline)
      Clima__UrlBase: http://clima:8081
      Banco__MigrarAoIniciar: "true"
    ports:
      - "127.0.0.1:5080:5080"
    depends_on:
      db: { condition: service_healthy }
      mqtt: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5080/health/live >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 20

  clima:
    # o Clima Service (Spring Boot): o Flyway migra o banco dele ao subir
    build:
      context: services/clima-service
      args:
        COMMIT: ${SOMBRA_COMMIT:-dev}
        CONSTRUIDO_EM: ${SOMBRA_CONSTRUIDO_EM:-}
    image: sombra-clima-service:local
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      # o mesmo ambiente do Core nos logs (Development, Demo, Production)
      SOMBRA_AMBIENTE: ${ASPNETCORE_ENVIRONMENT:-Development}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/sombra_clima
      SPRING_DATASOURCE_USERNAME: sombra_clima
      SPRING_DATASOURCE_PASSWORD: ${CLIMA_DB_PASSWORD:?rode make env}
      # a coleta ao vivo da Open-Meteo (sem chave), a cada 10 min
      CLIMA_OPEN_METEO_HABILITADO: ${CLIMA_OPEN_METEO_HABILITADO:-true}
      CLIMA_OPEN_METEO_URL: ${CLIMA_OPEN_METEO_URL:-https://api.open-meteo.com/v1/forecast}
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/actuator/health/liveness >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 20

  painel:
    # o painel web: o nginx serve o build e repassa /api e /hubs ao Core (e só as sondas do Clima)
    build:
      context: web/painel
      additional_contexts:
        design: ./design
      args:
        COMMIT: ${SOMBRA_COMMIT:-dev}
    image: sombra-painel:local
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      core: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173/healthz >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  dados-postgres:
