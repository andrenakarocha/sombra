# Mosquitto do ambiente local e do CI. Anônimo de propósito: escuta só em 127.0.0.1 (compose) e a segurança das
# mensagens vem da assinatura HMAC (ADR-004), que o Core confere de qualquer forma.
listener 1883
allow_anonymous true
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
