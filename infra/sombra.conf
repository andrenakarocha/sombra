# shellcheck shell=bash disable=SC2034  # lidas pelas etapas que fazem source deste arquivo
# Sombra · a configuração do servidor, num lugar só. As etapas leem daqui; nada de valor fixo espalhado nos scripts.
# Para outra máquina (uma VM na nuvem, por exemplo), basta trocar estes valores.

SOMBRA_HOSTNAME=sombra-srv01
SOMBRA_DOMINIO=sombra.local
SOMBRA_FUSO=America/Sao_Paulo
SOMBRA_LOCALE=pt_BR.UTF-8

# Rede: a interface da rede interna recebe o IP estático (vazio = a primeira interface que não é a da rota padrão).
SOMBRA_INTERFACE=
SOMBRA_IP=192.168.56.10
SOMBRA_PREFIXO=24
# Para onde o DNS local encaminha o que não é da zona sombra.local (vazio = os servidores que a máquina já usava).
SOMBRA_DNS_EXTERNO=

# Os nomes da zona sombra.local, todos no próprio servidor (o nginx separa pelo nome).
SOMBRA_NOMES="api clima painel"

# Usuários: o de serviço (sem shell) e os operadores que entram no grupo sombra-ops.
SOMBRA_USUARIO_SERVICO=sombra
SOMBRA_GRUPO_OPS=sombra-ops
SOMBRA_OPERADORES="${SUDO_USER:-vagrant}"
