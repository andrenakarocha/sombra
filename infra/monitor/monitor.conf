# shellcheck shell=bash disable=SC2034  # lidas pelo sombra-monitor.sh
# Sombra · limites do monitor (instalado em /etc/sombra/monitor.conf). Mudou? sudo systemctl restart sombra-monitor
INTERVALO=15                 # segundos entre verificações (o watchdog do systemd espera no máximo 30)
CICLOS_PARA_ALERTAR=3        # quantas verificações seguidas acima do limite antes de alertar (sem alarme à toa)
REPETIR_ALERTA_EM=300        # enquanto continuar acima, alerta de novo a cada tantos segundos

CPU_AVISO=80
CPU_CRITICO=90
RAM_AVISO=80
RAM_CRITICO=90
DISCO_AVISO=80
DISCO_CRITICO=90
DISCO_PONTOS="/ /var"

SERVICOS="sombra-core sombra-clima postgresql mosquitto nginx dnsmasq"
SAUDE="sombra-core=http://127.0.0.1:5080/health/ready sombra-clima=http://127.0.0.1:8081/actuator/health/readiness nginx=http://painel.sombra.local/healthz"

CORE_ALERTAS_URL=http://127.0.0.1:5080/api/v1/ops/alertas
