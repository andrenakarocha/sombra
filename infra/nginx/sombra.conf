# Sombra · nginx do sombra-srv01 (instalado por infra/steps/70-aplicacao.sh). Três nomes da zona sombra.local:
#   painel.sombra.local  o painel (estático) + /api e /hubs do Core, numa origem só (sem CORS)
#   api.sombra.local     o Core
#   clima.sombra.local   o Clima, só leitura (GET): a API dele não tem login, então nada que escreve passa daqui
# Os serviços escutam só em 127.0.0.1; o nginx é a única porta para a rede.
map $http_upgrade $conexao_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80 default_server;
  server_name _;
  return 444;
}

server {
  listen 80;
  server_name painel.sombra.local;
  root /opt/sombra/atual/painel;
  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }
  location /api/ {
    proxy_pass http://127.0.0.1:5080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location ~ ^/(health|version) {
    proxy_pass http://127.0.0.1:5080;
  }
  location /hubs/ {
    proxy_pass http://127.0.0.1:5080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $conexao_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
  }
  location /clima/actuator/ {
    proxy_pass http://127.0.0.1:8081/actuator/;
  }
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location / {
    try_files $uri /index.html;
  }
}

server {
  listen 80;
  server_name api.sombra.local;
  server_tokens off;
  location / {
    proxy_pass http://127.0.0.1:5080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $conexao_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}

server {
  listen 80;
  server_name clima.sombra.local;
  server_tokens off;
  location / {
    limit_except GET HEAD {
      deny all;
    }
    proxy_pass http://127.0.0.1:8081;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
