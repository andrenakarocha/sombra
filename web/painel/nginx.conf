# Sombra · o painel no compose: o nginx serve o build estático e repassa a API e o hub ao Core, numa origem só (sem
# CORS). Do Clima, só as sondas de saúde ficam visíveis ao navegador; a API dele não tem login e não passa daqui.
map $http_upgrade $conexao_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 5173;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location /api/ {
    proxy_pass http://core:5080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location ~ ^/(health|version) {
    proxy_pass http://core:5080;
  }

  location /hubs/ {
    proxy_pass http://core:5080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $conexao_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
  }

  location /clima/actuator/ {
    proxy_pass http://clima:8081/actuator/;
  }

  # as rotas do React (/alertas, /casas…) caem no index.html; os assets com hash ficam em cache longo
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location / {
    try_files $uri /index.html;
  }
}
