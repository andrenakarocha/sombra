# Casos de teste do Sombra (F10.3) · caixa-preta, positivos e negativos (spec 09, D9).
#
# Cada caso vira um work item "Test Case" no Azure Boards, ligado à Feature por "Tested By". Os passos vão para
# Microsoft.VSTS.TCM.Steps (ação → resultado esperado).
#
# Campos:
#   tipo         positivo | negativo
#   tecnica      particao-de-equivalencia | valor-limite | tabela-de-decisao | transicao-de-estados
#   criterio     o critério de aceite da Feature que o caso verifica (features.yaml)
#   execucao     automatizado (roda no CI) · manual (passo humano, com evidência no PDF da F10.5)
#   automatizado os testes que executam o caso: suite (mstest no Core · jest no app · pytest no simulador da
#                Sentinela), arquivo a partir da raiz do repositório e o nome do teste
#
# Nenhum dado pessoal real: CPF e Cartão SUS vêm do gerador sintético dos testes (`DocumentosSinteticos`) e as
# pessoas são as personas fictícias.

versao: 1

casos:
  # ── F01 · Monitoramento térmico ──────────────────────────────────────────────────────────────────────────────
  - id: TC01
    feature: F01
    criterio: F01-CA1
    titulo: Pico de onda de calor é classificado como PERIGO
    tipo: positivo
    tecnica: particao-de-equivalencia
    objetivo: Verificar que uma leitura típica de onda de calor vira o índice e o nível do contrato.
    preparacao:
      - Casa monitorada com uma Sentinela vinculada.
    entradas: { temperaturaC: 35.0, umidadePct: 50 }
    passos:
      - acao: A Sentinela envia a leitura de 35,0 °C e 50% de umidade.
        esperado: O Core aceita a leitura.
      - acao: Consultar as leituras da casa.
        esperado: Índice de calor 40,68 °C (±0,05) e nível PERIGO.
    resultado_esperado: Índice 40,68 °C, nível PERIGO, igual nas implementações em C#, TypeScript e Python.
    execucao: automatizado
    automatizado:
      - suite: mstest
        arquivo: services/core-api/sources/Sombra.Dominio.Tests/Calor/IndiceDeCalorTests.cs
        teste: 'IndiceDeCalorTests.BateComOsVetoresDoContrato'
      - suite: jest
        arquivo: mobile/__tests__/domain/clima-test.ts
        teste: 'os vetores cobrem os cinco níveis'
      - suite: pytest
        arquivo: tools/sentinela-sim/tests/test_contratos.py
        teste: 'test_indice_de_calor_bate_com_os_vetores'

  - id: TC02
    feature: F01
    criterio: F01-CA1
    titulo: Limites dos níveis são fechados embaixo e abertos em cima
    tipo: positivo
    tecnica: valor-limite
    objetivo: Verificar a fronteira de cada nível, para nenhum índice cair no nível errado.
    preparacao:
      - Tabela de níveis do contrato (`docs/contratos/niveis-de-risco.md`).
    entradas: { indicesC: [26.66, 26.67, 32.21, 32.22, 39.43, 39.44, 51.66, 51.67] }
    passos:
      - acao: Classificar 26,66 e 26,67 °C.
        esperado: NORMAL e ATENCAO.
      - acao: Classificar 32,21 e 32,22 °C.
        esperado: ATENCAO e CAUTELA_EXTREMA.
      - acao: Classificar 39,43 e 39,44 °C.
        esperado: CAUTELA_EXTREMA e PERIGO.
      - acao: Classificar 51,66 e 51,67 °C.
        esperado: PERIGO e PERIGO_EXTREMO.
    resultado_esperado: Cada limite pertence ao nível de cima.
    execucao: automatizado
    automatizado:
      - suite: mstest
        arquivo: services/core-api/sources/Sombra.Dominio.Tests/Calor/IndiceDeCalorTests.cs
        teste: 'IndiceDeCalorTests.LimitesPadraoSaoOsDoContrato'
      - suite: jest
        arquivo: mobile/__tests__/domain/clima-test.ts
        teste: 'intervalo fechado embaixo e aberto em cima'

  - id: TC03
    feature: F01
    criterio: F01-CA3
    titulo: Leitura fora da faixa física é recusada
    tipo: negativo
    tecnica: valor-limite
    objetivo: Garantir que um sensor com defeito não abra nem feche alerta.
    preparacao:
      - Casa monitorada com uma Sentinela vinculada.
    entradas: { temperaturasC: [60.0, 60.1, -10.1], umidadesPct: [100.1, NaN] }
    passos:
      - acao: Enviar 60,0 °C.
        esperado: Aceita (é o máximo da faixa).
      - acao: Enviar 60,1 °C, −10,1 °C, umidade 100,1% e umidade vazia (NaN).
        esperado: Cada uma é recusada pela regra R9.
      - acao: Consultar as leituras da casa.
        esperado: Nenhuma das leituras recusadas foi gravada.
    resultado_esperado: Recusa por R9, sem gravar nada.
    execucao: automatizado
    automatizado:
      - suite: mstest
        arquivo: services/core-api/sources/Sombra.Dominio.Tests/Calor/IndiceDeCalorTests.cs
        teste: 'IndiceDeCalorTests.RecusaLeituraForaDaFaixaFisica'
      - suite: mstest
        arquivo: services/core-api/sources/Sombra.Aplicacao.Tests/Alertas/RegistrarLeituraTests.cs
        teste: 'RegistrarLeituraTests.RecusaEntradasRuinsSemGravar'

  - id: TC04
    feature: F01
    criterio: F01-CA4
    titulo: Telemetria adulterada ou repetida vira evento de segurança
    tipo: negativo
    tecnica: particao-de-equivalencia
    objetivo: Verificar que ninguém consegue forjar ou reaproveitar uma leitura pelo MQTT.
    preparacao:
      - Core e Mosquitto no ar; Sentinela com segredo HMAC.
    entradas: { mensagens: [assinatura válida, um campo alterado depois de assinar, mesmo seq de novo] }
    passos:
      - acao: Publicar uma telemetria assinada corretamente.
        esperado: A leitura é registrada.
      - acao: Publicar a mesma mensagem com a temperatura alterada depois da assinatura.
        esperado: Descartada; evento MQTT_ASSINATURA_INVALIDA.
      - acao: Publicar de novo a primeira mensagem, com o mesmo seq.
        esperado: Descartada; evento MQTT_REPLAY.
    resultado_esperado: Só a mensagem íntegra vira leitura; as outras viram eventos de segurança (R10).
    execucao: automatizado
    automatizado:
      - suite: mstest
        arquivo: services/core-api/sources/Sombra.Api.IntegrationTests/MqttTests.cs
        teste: 'MqttTests.AdulteradoERepetidoViramEventoDeSeguranca'
      - suite: mstest
        arquivo: services/core-api/sources/Sombra.Infraestrutura.Tests/AssinaturaMqttTests.cs
        teste: 'AssinaturaMqttTests.BateComOsVetoresDoContrato'
      - suite: pytest
        arquivo: tools/sentinela-sim/tests/test_cenarios.py
        teste: 'test_payload_adulterado_tem_uma_mensagem_alterada'

  - id: TC05
    feature: F01
    criterio: F01-CA2
    titulo: Card da casa fica vermelho ao vivo, sem recarregar
    tipo: positivo
    tecnica: transicao-de-estados
    objetivo: Verificar que a família vê a mudança de nível no momento em que ela acontece.
    preparacao:
      - App logado na tela de Início, com a casa em NORMAL.
    entradas: { evento: LeituraRegistrada, nivel: PERIGO }
    passos:
      - acao: A Sentinela manda uma leitura de perigo.
        esperado: O hub entrega o evento LeituraRegistrada ao app.
      - acao: Olhar o card da casa, sem puxar para atualizar.
        esperado: Cor vermelha, ícone ⚠ e o texto "Perigo".
    resultado_esperado: O card muda de NORMAL para PERIGO ao vivo, com cor, ícone e texto.
    execucao: automatizado
    automatizado:
      - suite: jest
        arquivo: mobile/__tests__/telas-test.tsx
        teste: '🔎 o card fica vermelho ao vivo quando a Sentinela manda a leitura de perigo, sem recarregar'

  # ── F02 · Previsão de 24 h ───────────────────────────────────────────────────────────────────────────────────
  - id: TC06
    feature: F02
    criterio: F02-CA1
    titulo: Previsão de perigo abre um alerta preventivo por casa
    tipo: positivo
    tecnica: particao-de-equivalencia
    objetivo: Verificar que a previsão do Clima vira um aviso na véspera para cada casa da região.
    preparacao:
      - Duas casas monitoradas na mesma região, sem alerta aberto.
      - Clima respondendo uma previsão de PERIGO nas próximas 24 h.
    entradas: { previsao: PERIGO, horizonte: 24 h }
    passos:
      - acao: O worker de previsão roda.
        esperado: Abre um alerta PREVENTIVO em cada casa.
      - acao: Consultar os alertas.
        esperado: Dois alertas PREVENTIVO, um por casa, com prazo de 24 h.
    resultado_esperado: Um preventivo por casa, sem duplicar.
    execucao: automatizado
    automatizado:
      - suite: mstest
        arquivo: services/core-api/sources/Sombra.Aplicacao.Tests/Alertas/AvaliarPrevisoesTests.cs
        teste: 'AvaliarPrevisoesTests.PrevisaoDePerigoAbreUmPreventivoPorCasa'
      - suite: jest
        arquivo: mobile/__tests__/domain/alerta-test.ts
        teste: 'o preventivo abre em qualquer nível, com prazo informativo de 24 h'

  - id: TC07
    feature: F02
    criterio: F02-CA2
    titulo: Clima fora do ar, ou casa com alerta, não abre preventivo
    tipo: negativo
    tecnica: tabela-de-decisao
    objetivo: Garantir que a falha do Clima não gera alerta falso e que um alerta aberto não é duplicado.
    preparacao:
      - Casa A sem alerta; casa B com um alerta de Sentinela aberto.
    entradas: { combinacoes: [Clima fora do ar × casa A, Clima com PERIGO × casa B] }
    passos:
      - acao: Rodar o worker com o Clima fora do ar.
        esperado: Nenhum alerta novo; o worker não quebra.
      - acao: Rodar com previsão de PERIGO para a casa B.
        esperado: Nenhum preventivo novo na casa B.
    resultado_esperado: Nenhum alerta aberto nas duas combinações.
    execucao: automatizado
    automatizado:
      - suite: mstest
        arquivo: services/core-api/sources/Sombra.Aplicacao.Tests/Alertas/AvaliarPrevisoesTests.cs
        teste: 'AvaliarPrevisoesTests.ClimaForaOuCasaComAlertaNaoAbre'

  - id: TC08
    feature: F02
    criterio: F02-CA3
    titulo: Preventivo vencido expira sem chamar a rede
    tipo: negativo
    tecnica: transicao-de-estados
    objetivo: Verificar que um aviso de previsão nunca vira alarme para a rede.
    preparacao:
      - Um alerta PREVENTIVO aberto há 24 h, sem resposta.
    entradas: { relogio: prazo + 1 min }
    passos:
      - acao: O escalonador roda depois do prazo.
        esperado: O alerta vai para Expirado.
      - acao: Conferir os avisos da rede.
        esperado: Nenhum degrau foi disparado.
    resultado_esperado: Aberto → Expirado, sem escalonar.
    execucao: automatizado
    automatizado:
      - suite: mstest
        arquivo: services/core-api/sources/Sombra.Aplicacao.Tests/Alertas/EscalonamentoTests.cs
        teste: 'EscalonamentoTests.PreventivoVencidoExpira'
      - suite: mstest
        arquivo: services/core-api/sources/Sombra.Dominio.Tests/Alertas/AlertasTests.cs
        teste: 'AlertasTests.PreventivoInformaEExpira'

  # ── F03 · Alerta com "estou bem" ─────────────────────────────────────────────────────────────────────────────
  - id: TC09
    feature: F03
    criterio: F03-CA1
    titulo: Prazo do "estou bem" depende do nível
    tipo: positivo
    tecnica: particao-de-equivalencia
    objetivo: Verificar que o alerta abre a partir de CAUTELA_EXTREMA, com prazo menor quanto maior o risco.
    preparacao:
      - Casa monitorada, sem alerta aberto.
    entradas: { leituras: ["30,0 °C / 70% → 35,04 °C (CAUTELA_EXTREMA)", "35,0 °C / 50% → 40,68 °C (PERIGO)"] }
    passos:
      - acao: Enviar a leitura de CAUTELA_EXTREMA.
        esperado: Abre o alerta pedindo "estou bem" em 30 min; a Sentinela recebe o comando.
      - acao: Repetir numa casa nova com a leitura de PERIGO.
        esperado: Abre o alerta pedindo "estou bem" em 15 min.
    resultado_esperado: 30 min em CAUTELA_EXTREMA, 15 min em PERIGO (R6).
    execucao: automatizado
    automatizado:
      - suite: mstest
        arquivo: services/core-api/sources/Sombra.Dominio.Tests/Alertas/AlertasTests.cs
        teste: 'AlertasTests.AbreSoAPartirDeCautelaExtremaComPrazoPorNivel'
      - suite: mstest
        arquivo: services/core-api/sources/Sombra.Aplicacao.Tests/Alertas/RegistrarLeituraTests.cs
        teste: 'RegistrarLeituraTests.CautelaExtremaAbreOAlertaEAvisaASentinela'

  - id: TC10
    feature: F03
    criterio: F03-CA1
    titulo: Abaixo de CAUTELA_EXTREMA não pede "estou bem"
    tipo: negativo
    tecnica: valor-limite
    objetivo: Garantir que a Sentinela não incomoda a pessoa num dia só quente (D13).
    preparacao:
      - Casa monitorada, sem alerta aberto.
    entradas: { leitura: "30,0 °C / 50% → 31,05 °C (ATENCAO)" }
    passos:
      - acao: Enviar a leitura de ATENCAO.
        esperado: A leitura é guardada.
      - acao: Consultar os alertas da casa.
        esperado: Nenhum alerta; a Sentinela não pede o botão.
    resultado_esperado: Só a leitura é guardada; nenhum alerta é aberto.
    execucao: automatizado
    automatizado:
      - suite: mstest
        arquivo: services/core-api/sources/Sombra.Aplicacao.Tests/Alertas/RegistrarLeituraTests.cs
        teste: 'RegistrarLeituraTests.SemRiscoOuSemMonitoramentoSoGuardaALeitura'
      - suite: jest
        arquivo: mobile/__tests__/domain/alerta-test.ts
        teste: 'abaixo de CAUTELA_EXTREMA a Sentinela não pede "estou bem"'

  - id: TC11
    feature: F03
    criterio: F03-CA2
    titulo: Caminho A · "estou bem" encerra o alerta
    tipo: positivo
    tecnica: transicao-de-estados
    objetivo: Verificar o caminho feliz do roteiro (§3.4, passo 4).
    preparacao:
      - Alerta em PERIGO aguardando o check-in.
    entradas: { acao: botão "estou bem" da Sentinela }
    passos:
      - acao: A pessoa aperta o botão dentro do prazo.
        esperado: O Core registra o check-in.
      - acao: Consultar o alerta.
        esperado: Resolvido, com o tempo até o check-in na linha do tempo.
    resultado_esperado: AguardandoCheckIn → Resolvido, com os minutos até o check-in.
    execucao: automatizado
    automatizado:
      - suite: mstest
        arquivo: services/core-api/sources/Sombra.Api.IntegrationTests/RoteiroTests.cs
        teste: 'RoteiroTests.CaminhoA'
      - suite: mstest
        arquivo: services/core-api/sources/Sombra.Aplicacao.Tests/Alertas/RegistrarCheckInTests.cs
        teste: 'RegistrarCheckInTests.CaminhoAEstouBemEncerraOAlerta'
      - suite: pytest
        arquivo: tools/sentinela-sim/tests/test_cenarios.py
        teste: 'test_onda_de_calor_chega_a_perigo_e_termina_com_estou_bem'

  - id: TC12
    feature: F03
    criterio: F03-CA3
    titulo: Leitura mais quente atualiza o mesmo alerta
    tipo: negativo
    tecnica: transicao-de-estados
    objetivo: Garantir um alerta por casa por vez (R4).
    preparacao:
      - Alerta de CAUTELA_EXTREMA aberto.
    entradas: { leitura: "35,0 °C / 50% → PERIGO" }
    passos:
      - acao: Enviar a leitura de PERIGO.
        esperado: O alerta existente sobe para PERIGO e o prazo encurta.
      - acao: Contar os alertas abertos da casa.
        esperado: Um só.
    resultado_esperado: Nenhum alerta duplicado; o aberto é atualizado.
    execucao: automatizado
    automatizado:
      - suite: mstest
        arquivo: services/core-api/sources/Sombra.Aplicacao.Tests/Alertas/RegistrarLeituraTests.cs
        teste: 'RegistrarLeituraTests.LeituraMaisQuenteAtualizaOMesmoAlerta'
      - suite: jest
        arquivo: mobile/__tests__/domain/alerta-test.ts
        teste: 'subir de nível encurta o prazo; descer não muda nada'

  - id: TC13
    feature: F03
    criterio: F03-CA4
    titulo: Carência de 1 h depois do "estou bem"
    tipo: negativo
    tecnica: tabela-de-decisao
    objetivo: Evitar que a casa ainda quente peça o botão de novo a cada leitura (R13).
    preparacao:
      - A pessoa acabou de resolver um alerta de PERIGO com "estou bem".
    entradas: { combinacoes: [mesmo nível em 30 min, nível mais alto em 30 min, mesmo nível depois de 1 h] }
    passos:
      - acao: Enviar uma leitura de PERIGO 30 min depois.
        esperado: Nenhum alerta novo.
      - acao: Enviar uma leitura de PERIGO_EXTREMO 30 min depois.
        esperado: Abre um alerta novo.
      - acao: Numa casa nova, enviar PERIGO 1 h depois do "estou bem".
        esperado: Abre um alerta novo.
    resultado_esperado: Dentro de 1 h, só um nível mais alto reabre o alerta.
    execucao: automatizado
    automatizado:
      - suite: mstest
        arquivo: services/core-api/sources/Sombra.Dominio.Tests/Alertas/AlertasTests.cs
        teste: 'AlertasTests.CarenciaDepoisDoEstouBem'
      - suite: mstest
        arquivo: services/core-api/sources/Sombra.Aplicacao.Tests/Alertas/RegistrarLeituraTests.cs
        teste: 'RegistrarLeituraTests.CarenciaDepoisDoEstouBem'

  - id: TC14
    feature: F03
    criterio: F03-CA2
    titulo: Alerta resolvido não aceita mais nada
    tipo: negativo
    tecnica: transicao-de-estados
    objetivo: Garantir que uma transição inválida da máquina de estados é recusada (R5).
    preparacao:
      - Um alerta já resolvido.
    entradas: { acoes: [reconhecer, escalonar] }
    passos:
      - acao: Reconhecer o alerta resolvido pela API.
        esperado: 422 com a regra violada.
      - acao: Rodar o escalonador.
        esperado: O alerta continua Resolvido.
    resultado_esperado: Resolvido é estado final; nada muda.
    execucao: automatizado
    automatizado:
      - suite: jest
        arquivo: mobile/__tests__/domain/alerta-test.ts
        teste: 'um alerta resolvido não aceita mais nada'
      - suite: jest
        arquivo: mobile/__tests__/caminhos-de-erro-test.tsx
        teste: 'casa, alerta e reconhecimento inexistentes; reconhecer alerta resolvido; escalonar sem alerta'

  # ── F04 · Escalonamento em degraus ───────────────────────────────────────────────────────────────────────────
  - id: TC15
    feature: F04
    criterio: F04-CA1
    titulo: Caminho B · sobe os três degraus com a vizinha
    tipo: positivo
    tecnica: transicao-de-estados
    objetivo: Verificar o escalonamento do roteiro (§3.4, passo 5).
    preparacao:
      - Alerta em PERIGO sem resposta; rede com a filha (familiar) e a vizinha (papel Vizinho).
    entradas: { relogio: "avança um prazo por vez" }
    passos:
      - acao: Vencer o prazo do "estou bem".
        esperado: Degrau 1, lembrete leve para a filha.
      - acao: Vencer o próximo prazo sem reconhecimento.
        esperado: Degrau 2, "pode dar uma olhada?" para a vizinha.
      - acao: Vencer o próximo prazo.
        esperado: Degrau 3, alerta para toda a rede; o OLED mostra "Sua filha foi avisada".
    resultado_esperado: 0 → 1 → 2 → 3, cada degrau avisando a pessoa certa.
    execucao: automatizado
    automatizado:
      - suite: mstest
        arquivo: services/core-api/sources/Sombra.Api.IntegrationTests/RoteiroTests.cs
        teste: 'RoteiroTests.CaminhoB'
      - suite: mstest
        arquivo: services/core-api/sources/Sombra.Infraestrutura.Tests/FluxoDeAlertaTests.cs
        teste: 'FluxoDeAlertaTests.CaminhoBAtravessaRequisicoes'
      - suite: jest
        arquivo: mobile/__tests__/domain/alerta-test.ts
        teste: 'com perigo e vizinho: 1 família → 2 vizinha → 3 rede, a cada 10 min'

  - id: TC16
    feature: F04
    criterio: F04-CA2
    titulo: CAUTELA_EXTREMA nunca passa do lembrete leve
    tipo: negativo
    tecnica: tabela-de-decisao
    objetivo: Garantir que a família não recebe alarme quando não há perigo (D13).
    preparacao:
      - Alerta em CAUTELA_EXTREMA sem resposta.
    entradas: { nivel: CAUTELA_EXTREMA, prazos_vencidos: 3 }
    passos:
      - acao: Vencer o prazo do "estou bem".
        esperado: Degrau 1, lembrete leve para a filha.
      - acao: Vencer mais dois prazos.
        esperado: Continua no degrau 1; vizinha e rede não recebem nada.
    resultado_esperado: O degrau máximo é 1 sem perigo.
    execucao: automatizado
    automatizado:
      - suite: mstest
        arquivo: services/core-api/sources/Sombra.Dominio.Tests/Alertas/AlertasTests.cs
        teste: 'AlertasTests.EmCautelaExtremaNuncaPassaDoLembreteLeve'
      - suite: mstest
        arquivo: services/core-api/sources/Sombra.Aplicacao.Tests/Alertas/EscalonamentoTests.cs
        teste: 'EscalonamentoTests.CautelaExtremaParaNoLembreteLeve'
      - suite: jest
        arquivo: mobile/__tests__/domain/alerta-test.ts
        teste: 'sem perigo (CAUTELA_EXTREMA), nunca passa do lembrete leve'

  - id: TC17
    feature: F04
    criterio: F04-CA1
    titulo: Sem vizinha na rede, pula do degrau 1 para o 3
    tipo: positivo
    tecnica: tabela-de-decisao
    objetivo: Verificar que a falta de vizinho não trava o escalonamento.
    preparacao:
      - Alerta em PERIGO; rede só com familiares.
    entradas: { rede: [FAMILIAR] }
    passos:
      - acao: Vencer o prazo do "estou bem".
        esperado: Degrau 1 para a filha.
      - acao: Vencer o próximo prazo.
        esperado: Degrau 3, direto para toda a rede.
    resultado_esperado: 1 → 3, sem o degrau 2.
    execucao: automatizado
    automatizado:
