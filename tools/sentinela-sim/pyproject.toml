[project]
name = "sentinela-sim"
version = "1.0.0"
description = "Simulador da Sentinela do Sombra: MQTT assinado conforme docs/contratos/mqtt.asyncapi.yaml"
requires-python = ">=3.12"
dependencies = ["paho-mqtt>=2.1,<3"]

[project.scripts]
sentinela-sim = "sentinela_sim.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinela_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
