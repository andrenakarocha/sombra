# Sombra · Clima Service. Toda credencial vem do ambiente (o compose define SPRING_DATASOURCE_*; para rodar fora do
# compose, o .env da raiz do repositório é lido como fallback e nunca vai para o Git).
spring:
  application:
    name: clima-service
  config:
    import: optional:file:../../.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:${DB_PORTA_LOCAL:55432}/sombra_clima}
    username: ${SPRING_DATASOURCE_USERNAME:sombra_clima}
    password: ${SPRING_DATASOURCE_PASSWORD:${CLIMA_DB_PASSWORD:}}
  jpa:
    # o esquema é das migrações (Flyway); o Hibernate só confere
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/migration
  jackson:
    time-zone: UTC
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: true

server:
  port: 8081
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  servico: clima-service
  commit: ${SOMBRA_COMMIT:dev}
  construidoEm: ${SOMBRA_CONSTRUIDO_EM:}
