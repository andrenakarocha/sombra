# Sombra · Clima Service. Toda credencial vem do ambiente (o compose define SPRING_DATASOURCE_*; para rodar fora do
# compose, o .env da raiz do repositório é lido como fallback e nunca vai para o Git).
spring:
  application:
    name: clima-service
  config:
    import: optional:file:../../.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:${DB_PORTA_LOCAL:55432}/sombra_clima}
    username: ${SPRING_DATASOURCE_USERNAME:sombra_clima}
    password: ${SPRING_DATASOURCE_PASSWORD:${CLIMA_DB_PASSWORD:}}
  jpa:
    # o esquema é das migrações (Flyway); o Hibernate só confere
    hibernate:
      ddl-auto: validate
    # sem hibernate.jdbc.time_zone: o Instant vai como timestamptz (absoluto) e o LocalTime do horário dos pontos é hora
    # de parede, que não pode ser deslocada pelo fuso da JVM
    open-in-view: false
  flyway:
    locations: classpath:db/migration
  jackson:
    time-zone: UTC
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: true
  web:
    # mensagens de validação em pt-BR, qualquer que seja o Accept-Language
    locale: pt_BR
    locale-resolver: fixed

springdoc:
  # a documentação é parte da entrega (rubrica de SOA): fica ligada de propósito
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    deep-linking: true
    display-request-duration: true
    tags-sorter: alpha
  paths-to-match: /api/**
  default-produces-media-type: application/json
  writer-with-order-by-keys: true

server:
  port: 8081
  error:
    include-stacktrace: never
    include-message: never

clima:
  open-meteo:
    # a coleta ao vivo liga no compose e na VM (CLIMA_OPEN_METEO_HABILITADO=true); nos testes, nunca
    habilitado: ${CLIMA_OPEN_METEO_HABILITADO:false}
    url: ${CLIMA_OPEN_METEO_URL:https://api.open-meteo.com/v1/forecast}
    intervalo: PT10M
    timeout: PT5S
    tentativas: 3
    espera: PT1S

sombra:
  # Development, Demo, Production ou Test (observabilidade §1)
  ambiente: ${SOMBRA_AMBIENTE:Development}

logging:
  # uma linha JSON por evento no stdout, com os campos da observabilidade §1
  structured:
    format:
      console: br.com.fiap.sombra.clima.infraestrutura.observabilidade.FormatoDoLog
  level:
    root: WARN
    br.com.fiap.sombra.clima: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      show-components: always
      group:
        # pronto = aceita tráfego e tem banco; o previsor aparece como detalhe (a regra mantém o serviço útil sem o modelo)
        readiness:
          include: readinessState,db,previsor
  info:
    env:
      enabled: true

info:
  servico: clima-service
  commit: ${SOMBRA_COMMIT:dev}
  construidoEm: ${SOMBRA_CONSTRUIDO_EM:}
